name: Deploy site

on:
  push:
    branches: [main]
    paths:
      - site/**
      - screenshots/**
      - public/icon/**
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Assemble the site
        run: |
          cp -r site _site
          mkdir -p _site/screenshots _site/icon
          cp screenshots/*.png screenshots/demo.mp4 _site/screenshots/
          cp public/icon/32.png public/icon/128.png _site/icon/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
